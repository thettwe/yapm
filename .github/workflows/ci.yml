name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  catalog-guard:
    name: Catalog guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-catalog.mjs

  boundary-guard:
    name: Package boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Deliberately no setup-node and no pnpm. Both scripts below import only node: builtins and read
      # files off the checkout, so this job needs nothing installed — and every attempt to set the
      # toolchain up here has failed the job while the checks themselves passed:
      #   - with pnpm/action-setup: the post-job cache save failed with "Path Validation Error: Path(s)
      #     specified in the action for caching do(es) not exist", because no install ever created a
      #     store. This turned main red on 6da1ae4 and 6171e41 with no code defect behind it.
      #   - without it: setup-node still shells out to pnpm (package.json's packageManager field) and
      #     failed with "Unable to locate executable file: pnpm".
      # The runner's preinstalled Node satisfies engines >=24. If these scripts ever gain a workspace
      # dependency, this job needs setup-node AND a real install — not one without the other.
      # `node --test`, not Vitest, for exactly the reason spelled out above: this job has no
      # install, so the test for the boundary rules has to run on builtins alone.
      - run: node --test scripts/lib/*.test.mjs
      - run: node scripts/check-boundaries.mjs
      - run: node scripts/check-image-manifests.mjs

  commit-check:
    name: Commit hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - name: Conventional Commits + DCO sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-msg.txt"
            if ! node scripts/check-commit-msg.mjs "$RUNNER_TEMP/commit-msg.txt"; then
              echo "::error::Commit $sha failed the commit message check"
              failed=1
            fi
          done
          exit $failed

  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: yapm
          POSTGRES_PASSWORD: yapm
          POSTGRES_DB: yapm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yapm -d yapm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://yapm:yapm@localhost:5432/yapm
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Lint
        run: pnpm turbo run lint
      - name: Typecheck
        run: pnpm turbo run typecheck
      - name: Test
        run: pnpm turbo run test
      - name: Build
        run: pnpm turbo run build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    env:
      YAPM_HOST_PORT: '3210'
      DATABASE_URL: postgres://yapm:yapm@localhost:5440/yapm
      E2E_ZERO_CACHE_URL: http://localhost:4848
      # Not a production deployment: the harness runs on its own throwaway secrets and should not
      # need generated ones to start.
      YAPM_ALLOW_INSECURE_DEFAULTS: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages (schema/ui dist the e2e stack imports)
        run: pnpm turbo run build
      - name: Install Playwright browser
        run: pnpm --filter @yapm/web exec playwright install --with-deps chromium
      - name: Start Postgres + zero-cache (fresh volumes, e2e port)
        run: docker compose -f docker/docker-compose.dev.yml up -d --wait --wait-timeout 180 postgres zero-cache
      - name: Run the Playwright suite
        run: pnpm --filter @yapm/web e2e
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Compose logs
        if: always()
        run: docker compose -f docker/docker-compose.dev.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.dev.yml down -v

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install smoke browser
        run: pnpm exec playwright install --with-deps chromium
      # Exactly the two commands the README quickstart prints, in that order. The stack boots with
      # NO YAPM_ALLOW_INSECURE_DEFAULTS, so a `.env` that was not read — or secrets that did not
      # reach the container — is a failed boot rather than a silently insecure one.
      - name: Generate .env with real secrets
        run: node scripts/init-env.mjs
      - name: Build and start the three-container stack
        run: docker compose --env-file .env -f docker/docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: Wait for /readyz
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/readyz > /dev/null; then
              echo "ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::/readyz never became ready"
          exit 1
      # The two steps below pin the BOOT COMPOSITION, which no unit test can: `shipped-defaults.ts`
      # is exercised in isolation everywhere else, and a build that dropped either its `/readyz`
      # registration or its call in `index.ts` would still be green.
      - name: The configuration check is wired up, and the generated secrets reached the container
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/readyz | tee /dev/stderr | grep -q 'no shipped defaults in use'
      - name: A shipped default refuses to boot under NODE_ENV=production
        run: |
          set -uo pipefail
          # `timeout` bounds the regression case: a build that lost the gate would BOOT here and
          # listen forever, and a hung job is a worse signal than a failed one.
          if output=$(timeout 120 docker compose --env-file .env -f docker/docker-compose.yml \
            run --rm --no-deps -e BETTER_AUTH_SECRET=yapm-dev-secret-change-me-in-production \
            yapm node dist/index.js 2>&1); then
            echo "$output"
            echo "::error::the app booted on a shipped BETTER_AUTH_SECRET"
            exit 1
          fi
          echo "$output"
          if ! echo "$output" | grep -q 'refusing to start'; then
            echo "::error::the app exited, but not on the shipped-default refusal"
            exit 1
          fi
      - name: Assert sign-up and Zero sync work in the prod image
        env:
          SMOKE_URL: http://localhost:3000
        run: node scripts/smoke.mjs
      - name: Compose logs
        if: always()
        run: docker compose --env-file .env -f docker/docker-compose.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose --env-file .env -f docker/docker-compose.yml down -v
