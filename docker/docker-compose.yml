name: yapm

services:
  postgres:
    image: postgres:18
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yapm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yapm}
      POSTGRES_DB: ${POSTGRES_DB:-yapm}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yapm} -d ${POSTGRES_DB:-yapm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  yapm:
    image: ${YAPM_IMAGE:-yapm:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-yapm}:${POSTGRES_PASSWORD:-yapm}@postgres:5432/${POSTGRES_DB:-yapm}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      SEED_WORKSPACE_NAME: ${SEED_WORKSPACE_NAME:-yapm}
      SEED_DEMO_CONTENT: "${SEED_DEMO_CONTENT:-false}"
      # Cycle auto-rollover. On by default; the cron is a literal default for the reason the
      # notification block below states.
      CYCLE_MAINTENANCE: "${CYCLE_MAINTENANCE:-true}"
      CYCLE_MAINTENANCE_CRON: "${CYCLE_MAINTENANCE_CRON:-* * * * *}"
      ZERO_QUERY_API_KEY: ${ZERO_QUERY_API_KEY:-yapm-zero-query-key-change-me}
      ZERO_MUTATE_API_KEY: ${ZERO_MUTATE_API_KEY:-yapm-zero-mutate-key-change-me}
      # The origin the BROWSER opens its sync socket to, served to the SPA by GET /api/config. It is
      # runtime configuration, not a build arg: one published image has to serve every host. Set it
      # to whatever a user's browser actually reaches — never the in-network `zero-cache:4848`.
      ZERO_CACHE_PUBLIC_URL: ${ZERO_CACHE_PUBLIC_URL:-http://localhost:4848}
      # Permit a production boot on the secrets this repository publishes. EVALUATION ONLY: with it
      # false (the default) the app refuses to start while POSTGRES_PASSWORD, BETTER_AUTH_SECRET or
      # either Zero API key is still at its shipped value. `node scripts/init-env.mjs` fills them.
      YAPM_ALLOW_INSECURE_DEFAULTS: "${YAPM_ALLOW_INSECURE_DEFAULTS:-false}"
      # better-auth runs in-process (no extra container). CHANGE the secret in production — it
      # encrypts the JWKS private key at rest, so a known value forges any user's sync token.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-yapm-dev-secret-change-me-in-production}
      # The browser-facing URL of this app; OAuth callbacks and token issuer/audience use it.
      # Set both to your real origin (and rebuild) when serving from a domain or a non-3000 port.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Optional providers / settings — empty means disabled, never a boot failure.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      YAPM_BOOTSTRAP_ADMIN_EMAIL: ${YAPM_BOOTSTRAP_ADMIN_EMAIL:-}
      # Outbound email. Empty for both transports means email is cleanly off. Setting either makes
      # EMAIL_FROM and PUBLIC_URL required; boot fails naming whichever is missing.
      SMTP_URL: ${SMTP_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Notification delivery and retention. Unlike the block above these carry LITERAL defaults
      # rather than `${VAR:-}`: an empty cron fails `z.string().min(1)` and an empty day count
      # coerces to 0 and fails `.min(1)`, so "unset" must mean "the documented default", not "empty".
      NOTIFICATION_EMAIL_CRON: "${NOTIFICATION_EMAIL_CRON:-*/2 * * * *}"
      NOTIFICATION_RETENTION_DAYS: "${NOTIFICATION_RETENTION_DAYS:-30}"
      NOTIFICATION_RETENTION_CRON: "${NOTIFICATION_RETENTION_CRON:-7 3 * * *}"
      # Connectors (GitHub App). Empty means the connector is cleanly off; the three GITHUB_APP_*
      # values are all-or-nothing and boot fails by name on a partial triplet.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_RECONCILE_CRON: "${GITHUB_RECONCILE_CRON:-*/15 * * * *}"
      # AI (BYO-key). Empty keys mean AI is cleanly off. The switches and the retention pair carry
      # LITERAL defaults for the reason the notification block above states: an empty cron fails
      # `min(1)` and an empty number coerces to 0, so "unset" must mean "the documented default".
      #
      # AI_PM_DIGEST governs the one feature whose output crosses a permission boundary, and
      # AI_PM_DIGEST_READY_EMAIL the one path that leaves the app entirely — both off here, both
      # opted into explicitly. AI_DISCLOSURE_RETENTION_* bound the disclosure audit log and apply
      # whether or not AI is on. See the disclosure-model self-hosting page.
      AI_ANTHROPIC_API_KEY: ${AI_ANTHROPIC_API_KEY:-}
      AI_GOOGLE_API_KEY: ${AI_GOOGLE_API_KEY:-}
      AI_OPENAI_API_KEY: ${AI_OPENAI_API_KEY:-}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-}
      AI_DIGEST_ON_CYCLE_CLOSE: "${AI_DIGEST_ON_CYCLE_CLOSE:-true}"
      AI_RETRO_DRAFT: "${AI_RETRO_DRAFT:-true}"
      AI_PM_DIGEST: "${AI_PM_DIGEST:-false}"
      AI_PM_DIGEST_READY_EMAIL: "${AI_PM_DIGEST_READY_EMAIL:-false}"
      AI_DISCLOSURE_RETENTION_DAYS: "${AI_DISCLOSURE_RETENTION_DAYS:-365}"
      AI_DISCLOSURE_RETENTION_CRON: "${AI_DISCLOSURE_RETENTION_CRON:-23 3 * * *}"
      # Server-side search index maintenance. Off keeps `/api/v1/search` answering from whatever the
      # index already holds rather than failing.
      SEARCH_INDEX: "${SEARCH_INDEX:-true}"
      SEARCH_INDEX_INTERVAL_SECONDS: "${SEARCH_INDEX_INTERVAL_SECONDS:-10}"
      SEARCH_RECONCILE_CRON: "${SEARCH_RECONCILE_CRON:-*/5 * * * *}"
      SEARCH_TEXT_CONFIG: "${SEARCH_TEXT_CONFIG:-simple}"
      SEARCH_STATEMENT_TIMEOUT_MS: "${SEARCH_STATEMENT_TIMEOUT_MS:-2000}"
      # Attachment byte storage. `local` is the DEFAULT and is COMPLETE — the `files` volume below
      # is all a self-hoster needs, and there is no fourth container. Set STORAGE_PROVIDER=s3 with
      # the whole quartet to use an object store instead; a partial quartet fails boot by name.
      # THERE ARE NO SHAREABLE LINKS, by design: the app proxies every byte so the permission check
      # is the same code for both providers. See the attachments self-hosting page.
      STORAGE_PROVIDER: "${STORAGE_PROVIDER:-local}"
      STORAGE_LOCAL_DIR: "${STORAGE_LOCAL_DIR:-/var/lib/yapm/files}"
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # For R2 / Backblaze B2 / Garage / a MinIO you already run. Empty means AWS.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-false}"
      # LITERAL defaults, like the notification block above and for the same reason: an empty cron
      # fails `min(1)` and an empty number coerces to 0, so "unset" must mean "the documented
      # default", never "empty".
      ATTACHMENT_MAX_BYTES: "${ATTACHMENT_MAX_BYTES:-26214400}"
      ATTACHMENT_ORPHAN_GRACE_HOURS: "${ATTACHMENT_ORPHAN_GRACE_HOURS:-24}"
      ATTACHMENT_GC_CRON: "${ATTACHMENT_GC_CRON:-23 4 * * *}"
    volumes:
      # Attachment bytes under the local provider. Without it, every image a team pastes is lost on
      # the next `docker compose up` — which is why STORAGE_PROVIDER is explicit rather than
      # inferred and why `/readyz` probes the directory at boot.
      - files:/var/lib/yapm/files
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${YAPM_HOST_PORT:-3000}:3000"
    restart: unless-stopped

  zero-cache:
    image: ${ZERO_IMAGE:-rocicorp/zero:1.8.0}
    environment:
      # Replication upstream. MUST be a direct Postgres connection — never a pooler
      # (pgbouncer et al.): zero-cache creates a logical replication slot on it.
      ZERO_UPSTREAM_DB: postgres://${POSTGRES_USER:-yapm}:${POSTGRES_PASSWORD:-yapm}@postgres:5432/${POSTGRES_DB:-yapm}
      # Client-View-Records and change-log stores. Would use a pooler in a large
      # multi-node deploy; this single-node stack has no pooler, so both point at
      # the same direct connection.
      ZERO_CVR_DB: postgres://${POSTGRES_USER:-yapm}:${POSTGRES_PASSWORD:-yapm}@postgres:5432/${POSTGRES_DB:-yapm}
      ZERO_CHANGE_DB: postgres://${POSTGRES_USER:-yapm}:${POSTGRES_PASSWORD:-yapm}@postgres:5432/${POSTGRES_DB:-yapm}
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD:-change-me-in-production}
      ZERO_QUERY_URL: http://yapm:3000/api/zero/query
      ZERO_MUTATE_URL: http://yapm:3000/api/zero/mutate
      ZERO_QUERY_API_KEY: ${ZERO_QUERY_API_KEY:-yapm-zero-query-key-change-me}
      ZERO_MUTATE_API_KEY: ${ZERO_MUTATE_API_KEY:-yapm-zero-mutate-key-change-me}
      ZERO_ENABLE_CRUD_MUTATIONS: "false"
      ZERO_PORT: 4848
      # zero-cache's own level, separate from the app's LOG_LEVEL. `debug` while diagnosing
      # a connection that will not settle (see the sync-recovery self-hosting page).
      ZERO_LOG_LEVEL: ${ZERO_LOG_LEVEL:-info}
    depends_on:
      yapm:
        condition: service_healthy
    ports:
      - "${ZERO_CACHE_HOST_PORT:-4848}:4848"
    volumes:
      - zero-replica:/data
    stop_grace_period: 10m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4848/keepalive"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  zero-replica:
  files:
